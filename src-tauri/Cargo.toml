[package]
name = "promptrig"
version = "0.1.0"
description = "Desktop app for prompt engineering and side-by-side LLM comparison"
authors = ["PromptRig contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "promptrig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
keyring = "4.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
async-trait = "0.1.92"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# Not used directly: reqwest's "rustls" feature pulls in aws-lc-rs as its crypto backend, which
# needs NASM to build its assembly-optimized code on Windows. GitHub's windows-latest runners
# don't ship NASM, so we depend on aws-lc-rs ourselves just to turn on "prebuilt-nasm" (ships
# precompiled objects instead) via Cargo's feature unification across the whole build.
aws-lc-rs = { version = "1.18.1", features = ["prebuilt-nasm"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
