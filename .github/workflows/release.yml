name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          # ubuntu-22.04 (not -latest) on purpose: an AppImage/.deb built on a newer Ubuntu links
          # against a newer glibc, which then refuses to run on users' older distros. Building on
          # the oldest still-supported LTS keeps the resulting binaries usable on more systems.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # No code-signing secrets are configured (deliberately deferred — see docs/release.md):
      # the produced macOS .app/.dmg and Windows .exe are unsigned, so Gatekeeper/SmartScreen
      # show an extra warning on first launch. Still fully installable, just not as polished.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PromptRig ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version. See docs/release.md for per-OS install instructions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
